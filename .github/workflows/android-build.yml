name: Android Release Build

on:
  push:
    branches:
      - master
      - main
      - feat/virtual-hdmi-mirror
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # GitHub-hosted runners already set ANDROID_SDK_ROOT to their own SDK dir; AGP aborts
          # if ANDROID_HOME and ANDROID_SDK_ROOT disagree. Point both at our install location.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null
          # compileSdk=37 = Android 17 preview; only published in the canary channel, versioned
          # (e.g. platforms;android-37.2-beta3). sdkmanager cannot resolve a bare "android-37",
          # so pick the latest android-37 preview from canary (fallback to a known-good build).
          LATEST37=$(sdkmanager --channel=3 --list 2>/dev/null | grep -oE 'platforms;android-37[0-9A-Za-z.\-]+' | sort -V | tail -1)
          if [ -z "$LATEST37" ]; then LATEST37="platforms;android-37.2-beta3"; fi
          echo "Resolved SDK platform: $LATEST37"
          sdkmanager --channel=3 "$LATEST37" "platform-tools" "build-tools;35.0.0"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miao-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" app/build/outputs/apk/release/*.apk \
            --title "Miao Release ${{ github.ref_name }}" \
            --notes "Auto-built APK. branch/tag: ${{ github.ref_name }}  commit: ${{ github.sha }}"
