name: Android Release Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 关键步骤：从 GitHub Secret 解码 JKS 文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/platform.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miao-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          name: Miao Release ${{ env.VERSION }}
          body: |
            ## Miao Version ${{ env.VERSION }}
            - 自动编译生成的正式版系统签名 APK。
            - 签名类型：AOSP Platform Keys.
            - 提交哈希：${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
