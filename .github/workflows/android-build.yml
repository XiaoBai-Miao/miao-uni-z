name: Android Release Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    # 授予发布权限
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > app/platform.jks
          if [ ! -s app/platform.jks ]; then echo "Keystore is empty!"; exit 1; fi

      - name: Build Release APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleRelease

      - name: Capture build error
        if: steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleRelease 2>&1 | tail -150 > /tmp/build_err.txt || true
          gh issue create --repo XiaoBai-Miao/miao-uni-z --title "CI Build Error $(date +%s)" --body-file /tmp/build_err.txt

      - name: Get Version Name
        id: get_version
        if: steps.build.outcome == 'success'
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Upload Release Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Miao-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create or Update GitHub Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          # 如果是标签推送，使用标签名；如果是普通推送，使用 'latest'
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          files: app/build/outputs/apk/release/*.apk
          name: Miao Release ${{ env.VERSION }}
          body: |
            ## Miao Version ${{ env.VERSION }}
            - 自动编译生成的正式版系统签名 APK。
            - 推送分支/标签：${{ github.ref_name }}
            - 提交哈希：${{ github.sha }}
          # 如果是普通推送，标记为预发布版本
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # 如果已存在则覆盖附件
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
