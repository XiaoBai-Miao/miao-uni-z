name: Android Release Build

on:
  push:
    branches:
      - master
      - main
      - feat/virtual-hdmi-mirror
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-37"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore (optional, from secrets.SIGNING_KEY)
        if: ${{ secrets.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > app/platform.jks
          if [ ! -s app/platform.jks ]; then echo "Keystore is empty!"; exit 1; fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miao-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          name: Miao Release ${{ env.VERSION }}
          body: |
            ## Miao Version ${{ env.VERSION }}
            - 自动编译生成的正式版系统签名 APK。
            - 推送分支/标签：${{ github.ref_name }}
            - 提交哈希：${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
